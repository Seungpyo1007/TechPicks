name: techpicks
description: "기기 사양을 하나의 지수로 비교하는 앱."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 2.0.0+1

environment:
  # json_serializable 6.14+ 가 ^3.8.0 이상을 요구한다.
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # easy_localization 이 전이로 끌고 오지만, 테스트 하네스가 직접 델리게이트를
  # 꽂아야 해서 명시한다.
  flutter_localizations:
    sdk: flutter



  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  easy_localization: ^3.0.7
  shared_preferences: ^2.5.5
  firebase_ai: ^3.15.0
  dio: ^5.11.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_riverpod: ^3.4.2
  device_info_plus: ^13.2.0
  animations: ^2.2.0
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6
  share_plus: ^13.3.0
  app_links: ^7.2.1
  connectivity_plus: ^7.3.1
  firebase_remote_config: ^6.5.6
  path_provider: ^2.1.6
  cloud_firestore: ^6.8.0
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  # 셰이더 패키지라 0.x 는 조금씩 그림이 달라진다. 고정해 둔다.
  liquid_glass_widgets: 0.29.6
  flutter_gemma: ^1.5.9
  flutter_gemma_builtin_ai: ^0.1.0
  image_picker: ^1.2.3
  firebase_storage: ^13.4.6
  # preserve/remove 를 앱에서 부른다. 그래서 dev 가 아니라 여기 있다.
  flutter_native_splash: ^2.4.1



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.15.1
  freezed: ^3.0.0
  json_serializable: ^6.14.1
  riverpod: ^3.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/translations/
    - assets/catalog/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo2.png"
  # iOS 는 모서리를 시스템이 깎는다. 그래서 네모난 원본을 따로 둔다 —
  # assets/logo/logo.png 의 둥근 모서리를 그라디언트로 메운 것이다.
  # App Store Connect 는 알파 채널이 있는 아이콘을 반려한다.
  image_path_ios: "tool/icons/ios_1024.png"
  remove_alpha_ios: true

flutter_native_splash:
  # 앱 배경 그라디언트의 첫 색. 흰 화면에서 파란 화면으로 튀지 않는다.
  color: "#EEF3FA"
  image: assets/logo/logo.png
  # 어두운 테마로 켜면 흰 화면이 한 번 번쩍였다. 배경 그라디언트의 첫 색과
  # 같은 값이다 (TpTokens.iosDark 의 pageBackground 첫 스톱).
  color_dark: "#121A24"
  image_dark: assets/logo/logo.png
  android: true
  ios: true
