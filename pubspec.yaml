name: techpicks
description: "기기 사양을 하나의 지수로 비교하는 앱."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 2.0.0+2

environment:
  # 고쳐 쓰는 native_liquid_glass 가 Dart 3.11 이상을 요구한다.
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # easy_localization 이 전이로 끌고 오지만, 테스트 하네스가 직접 델리게이트를
  # 꽂아야 해서 명시한다.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  easy_localization: ^3.0.7
  shared_preferences: ^2.5.5
  firebase_ai: ^3.15.0
  dio: ^5.11.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_riverpod: ^3.4.2
  device_info_plus: ^13.2.0
  animations: ^2.2.0
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6
  share_plus: ^13.3.0
  app_links: ^7.2.1
  connectivity_plus: ^7.3.1
  firebase_remote_config: ^6.5.6
  path_provider: ^2.1.6
  cloud_firestore: ^6.8.0
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  # 셰이더 패키지라 0.x 는 조금씩 그림이 달라진다. 고정해 둔다.
  liquid_glass_widgets: 0.29.6
  flutter_gemma: ^1.5.9
  flutter_gemma_builtin_ai: ^0.1.0
  image_picker: ^1.2.3
  # 프로필 사진 자르기. EXIF 회전을 굽고 512 JPEG 로 다시 굽는다.
  image: ^4.2.0
  firebase_storage: ^13.4.6
  # preserve/remove 를 앱에서 부른다. 그래서 dev 가 아니라 여기 있다.
  flutter_native_splash: ^2.4.1
  # 진짜 OS 유리(iOS 26 의 .glassEffect)를 플랫폼 뷰로 가져온다. 0.x 라 고정.
  native_liquid_glass: 0.2.14
  go_router: ^17.5.0
  motor: ^1.1.0



dependency_overrides:
  # 플러그인이 고르지도 않은 탭을 알려온다. 고친 사본을 쓴다 —
  # third_party/native_liquid_glass/PATCH.md 에 무엇을 고쳤는지 적어뒀다.
  native_liquid_glass:
    path: third_party/native_liquid_glass

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.0.0
  json_serializable: ^6.14.1
  riverpod: ^3.4.2

flutter:
  uses-material-design: true

  assets:
    # 디렉터리째 싣지 않는다. 런타임에 읽는 것만 싣는다.
    - assets/logo/NBlogo_black.png
    - assets/logo/apple_logo.png
    - assets/logo/google_logo.png
    - assets/translations/
    - assets/catalog/
    - assets/parts/
    - assets/laptops/

# 앱 아이콘은 손으로 둔다(flutter_launcher_icons 를 쓰지 않는다). iOS 는
# ios/Runner/AppIcon.icon(Icon Composer, iOS 26 유리)과 옛 iOS 용 AppIcon.appiconset,
# Android 는 mipmap-anydpi-v26 적응형 아이콘. 원본과 만드는 법은 tool/icons/README.md.

flutter_native_splash:
  # 앱 배경 그라디언트의 첫 색. 흰 화면에서 파란 화면으로 튀지 않는다.
  color: "#EEF3FA"
  # 플랫폼마다 그 플랫폼 아이콘, 토글은 꺼진 채. TpLaunch 가 같은 그림(TpLogo)에서
  # 이어받아 켠다. PNG 는 tool/icons/render_splash_test.dart 가 TpLogo 에서 뜬다.
  image_ios: assets/logo/logo.png
  image_android: assets/logo/logo_android.png
  # 어두운 테마로 켜면 흰 화면이 한 번 번쩍였다. 배경 그라디언트의 첫 색과
  # 같은 값이다 (TpTokens.iosDark 의 pageBackground 첫 스톱).
  color_dark: "#121A24"
  image_dark_ios: assets/logo/logo_dark.png
  image_dark_android: assets/logo/logo_android_dark.png
  android: true
  ios: true
