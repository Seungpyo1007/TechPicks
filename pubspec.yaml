name: techpicks
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  # json_serializable 6.14+ 가 ^3.8.0 이상을 요구한다.
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter



  cupertino_icons: ^1.0.8
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  google_sign_in: ^6.2.1
  animated_text_kit: ^4.2.1
  easy_localization: ^3.0.7
  restart_app: ^1.2.1
  device_info_plus: ^10.0.2
  webview_flutter: ^4.9.0
  permission_handler: ^12.0.1 # 권한 요청 패키지 (10.x는 Flutter v1 embedding 제거로 빌드 불가)
  shared_preferences: ^2.3.2
  firebase_vertexai: ^0.2.3+4
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  image_picker: ^1.1.2
  rive: ^0.13.14
  syncfusion_flutter_charts: ^33.1.46
  dio: ^5.11.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.15.1
  freezed: ^3.0.0
  json_serializable: ^6.14.1

flutter:

  uses-material-design: true

  assets:
    - assets/logo/
    - assets/images/
    - assets/translations/
    - assets/Rive/
    - assets/catalog/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo2.png"

flutter_native_splash:
  color: "#ffffff" # 배경색
  image: assets/logo/logo.png
  android: true
  ios: true
