name: flutter-ci

# 모든 PR은 이 워크플로를 통과해야 머지된다.
# 로컬 통과는 검증으로 치지 않는다 — 이 저장소는 전역 ~/.gradle 설정과
# 브랜치별 pubspec 불일치 때문에 "내 컴퓨터에서는 되는데" 상황을 이미 겪었다.

on:
  # 자동 실행은 릴리스 지점에서만. develop 으로 가는 PR 마다 돌리면
  # Android 빌드가 8분대라 알림과 러너 시간이 계속 나간다.
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'assets/**'
      - 'shared/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/flutter-ci.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'assets/**'
      - 'shared/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/flutter-ci.yml'
  # 그 외에는 필요할 때 브랜치를 지정해 직접 돌린다.
  #   gh workflow run flutter-ci.yml --ref <branch>
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  analyze-and-test:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: install deps
        run: flutter pub get

      - name: verify generated code is current
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build
            # 생성물이 커밋된 것과 다르면 누군가 codegen을 빼먹은 것이다.
            if ! git diff --exit-code --stat -- '*.g.dart' '*.freezed.dart'; then
              echo "::error::Generated code is stale. Run 'dart run build_runner build' and commit."
              exit 1
            fi
          else
            echo "no build_runner in pubspec, skipping"
          fi

      - name: analyze
        # v1 코드에 남은 경고·info는 별도 이슈로 정리 중이므로 에러만 실패로 본다.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: test
        run: |
          if [ -d test ] && [ -n "$(find test -name '*_test.dart' -print -quit)" ]; then
            flutter test --reporter expanded
          else
            echo "no test files yet, skipping"
          fi

  build-android:
    name: android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # Gradle 9.1 / AGP 8.13 조합은 JDK 17에서 검증했다.
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: write Firebase Android config
        # Firebase Console에서 com.techpicks.app 앱을 등록한 뒤 내려받은 실제
        # 설정만 쓴다. 임시 app id나 API key를 워크플로에 만들지 않는다.
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [ -z "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            echo "::error::Register com.techpicks.app in Firebase and set FIREBASE_ANDROID_CONFIG_BASE64."
            exit 1
          fi
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode \
            > android/app/google-services.json

      - name: install deps
        run: flutter pub get

      - name: build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  build-ios:
    name: ios release build & goldens
    # iOS 를 먼저 낸다. 여기가 없으면 iOS 빌드를 아무도 안 본다.
    # 골든도 macOS 밖에서는 건너뛰므로(test/golden/golden_harness.dart)
    # 리눅스 잡에서는 한 장도 검사되지 않는다.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: install deps
        run: flutter pub get

      # GoogleService-Info.plist 는 저장소에 없다. firebase_options.dart 로
      # 초기화하므로 빌드에는 필요 없다.
      - name: build (no codesign)
        run: flutter build ios --release --no-codesign

      - name: goldens
        # 러너의 렌더링이 개발 기계와 다르면 여기서 갈린다. 갈리면 실패한
        # 그림을 받아 눈으로 보고 기준선을 어디서 구울지 정한다.
        run: flutter test test/golden

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: test/golden/failures
          retention-days: 7
          if-no-files-found: ignore
