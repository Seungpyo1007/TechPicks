name: flutter-ci

# 모든 PR은 이 워크플로를 통과해야 머지된다.
# 로컬 통과는 검증으로 치지 않는다 — 이 저장소는 전역 ~/.gradle 설정과
# 브랜치별 pubspec 불일치 때문에 "내 컴퓨터에서는 되는데" 상황을 이미 겪었다.

on:
  pull_request:
    branches: [develop, main]
  # develop 은 PR 에서 이미 검사한 뒤에만 커밋이 들어온다. 머지 커밋으로 다시
  # 돌리면 같은 코드를 두 번 검사하고 알림도 두 배가 된다. main 은 릴리스
  # 지점이라 머지 후에도 한 번 더 본다.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  analyze-and-test:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: install deps
        run: flutter pub get

      - name: verify generated code is current
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build
            # 생성물이 커밋된 것과 다르면 누군가 codegen을 빼먹은 것이다.
            if ! git diff --exit-code --stat -- '*.g.dart' '*.freezed.dart'; then
              echo "::error::Generated code is stale. Run 'dart run build_runner build' and commit."
              exit 1
            fi
          else
            echo "no build_runner in pubspec, skipping"
          fi

      - name: analyze
        # v1 코드에 남은 경고·info는 별도 이슈로 정리 중이므로 에러만 실패로 본다.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: test
        run: |
          if [ -d test ] && [ -n "$(find test -name '*_test.dart' -print -quit)" ]; then
            flutter test --reporter expanded
          else
            echo "no test files yet, skipping"
          fi

  build-android:
    name: android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # Gradle 9.1 / AGP 8.13 조합은 JDK 17에서 검증했다.
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: write Firebase Android config
        # google-services.json은 gitignore 대상이라 저장소에 없다.
        # 아래 값은 lib/firebase_options.dart에 이미 커밋된 공개 클라이언트
        # 식별자와 동일하다. oauth_client가 비어 있어 Google 로그인은 되지
        # 않지만, 빌드 검증에는 충분하다 (issue #12).
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "746932050988",
              "project_id": "techpicks-project",
              "storage_bucket": "techpicks-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:746932050988:android:38c726866fc4693a8e8589",
                  "android_client_info": { "package_name": "com.example.techpicks" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyCvUWkpyXTAkDNcv1F7o2z-QDRK-u_00f4" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: install deps
        run: flutter pub get

      - name: build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
